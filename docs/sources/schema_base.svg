<text x="978" y="572" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1d2733" text-anchor="start" font-style="normal">• Pas de schéma imposé par MongoDB : c'est</text>
